<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="وب سرویس امن و سریع">
  <title>وب سرویس</title>
  <style>
    :root {
      --primary: #3b82f6;
      --bg: #0f172a;
      --text: #e2e8f0;
      --card: #1e2937;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
    }
    
    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }
    
    .icon {
      font-size: 4.5rem;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #60a5fa;
    }
    
    p {
      font-size: 1.15rem;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 8px 20px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 500;
      margin: 20px 0;
    }
    
    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #64748b;
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 2.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">🚀</div>
      <h1>وب سرویس</h1>
      <p>این دامنه برای ارائه خدمات وب با کیفیت بالا طراحی شده است.</p>
      
      <div class="status">
        <span>●</span>
        فعال و در حال کار
      </div>
      
      <p style="margin-top: 24px; font-size: 1rem;">
        ترافیک عادی از این آدرس پشتیبانی می‌شود.<br>
        برای استفاده تخصصی لطفاً از تنظیمات کلاینت خود استفاده کنید.
      </p>
    </div>
    
    <footer>
      © 2026 - تمام حقوق محفوظ است<br>
      <small>این یک سرویس وب عمومی است</small>
    </footer>
  </div>
</body>
</html>
